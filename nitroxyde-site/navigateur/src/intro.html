<!doctype html>
<html lang="fr"><meta charset="utf-8"><title>Nitroxyde</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
/* Intro du thème spécial TRON : grille qui s'allume, motos de lumière, logo NTRX qui s'éclaire, puis plongée dans la grille.
   Uniquement transform et opacity : fluide même sur une petite carte graphique. */
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#000;color:#e6fbff;font:14px "Segoe UI Variable",system-ui,sans-serif;cursor:none;user-select:none}
#stage{position:fixed;inset:0;animation:out .7s cubic-bezier(.6,0,.9,.4) 3.55s forwards}
@keyframes out{to{opacity:0;transform:scale(1.18)}}

/* Halo bleu au-dessus de l'horizon */
.haze{position:absolute;left:0;right:0;top:30%;height:40%;background:radial-gradient(60% 50% at 50% 60%,#00b8ff33,transparent 70%);opacity:0;animation:fade 1.4s ease .3s forwards}

/* Sol quadrillé en perspective, qui avance vers nous */
.floor{position:absolute;left:-60%;right:-60%;top:58%;height:160%;transform-origin:top;transform:perspective(340px) rotateX(74deg);opacity:0;
  -webkit-mask-image:linear-gradient(transparent,#000 22%);
  animation:fade .9s ease .35s forwards}
.floor i{position:absolute;inset:0;animation:run .9s linear infinite;background:
    linear-gradient(transparent 0 36px,#00e5ff26 36px 38px,#00e5ffee 38px 40px,#00e5ff26 40px 42px,transparent 42px) 0 0/80px 80px,
    linear-gradient(90deg,transparent 0 36px,#00e5ff26 36px 38px,#00e5ffee 38px 40px,#00e5ff26 40px 42px,transparent 42px) 0 0/80px 80px}
@keyframes run{to{transform:translateY(80px)}}
/* Plafond, reflet plus discret */
.ceil{position:absolute;left:-60%;right:-60%;bottom:58%;height:120%;transform-origin:bottom;transform:perspective(340px) rotateX(-74deg);opacity:0;
  -webkit-mask-image:linear-gradient(#000 0,transparent 80%);
  background:linear-gradient(transparent 0 38px,#00e5ff66 38px 40px,transparent 40px) 0 0/120px 120px,linear-gradient(90deg,transparent 0 38px,#00e5ff66 38px 40px,transparent 40px) 0 0/120px 120px;
  animation:fade2 1.2s ease .6s forwards}
@keyframes fade{to{opacity:1}}
@keyframes fade2{to{opacity:.22}}

/* Ligne d'horizon qui s'allume du centre vers les bords */
.horizon{position:absolute;left:0;right:0;top:58%;height:2px;margin-top:-1px;background:#bff6ff;box-shadow:0 0 8px #00e5ff,0 0 24px #00e5ff,0 0 60px #00b8ff;transform:scaleX(0);animation:line .7s cubic-bezier(.2,.8,.2,1) .1s forwards}
@keyframes line{to{transform:scaleX(1)}}

/* Motos de lumière : une bleue, une orange, qui se croisent en laissant leur trace */
.cycle{position:absolute;height:3px;width:100%;transform:scaleX(0);animation:trail 1.1s cubic-bezier(.5,0,.3,1) forwards}
.cycle::after{content:"";position:absolute;top:-3px;width:26px;height:9px;border-radius:4px;background:#fff}
.c1{top:78%;transform-origin:left;background:linear-gradient(90deg,transparent,#00e5ff);box-shadow:0 0 10px #00e5ff,0 0 26px #00e5ff;animation-delay:.55s}
.c1::after{right:-4px;box-shadow:0 0 14px 4px #00e5ff}
.c2{top:86%;transform-origin:right;background:linear-gradient(270deg,transparent,#ff9a1f);box-shadow:0 0 10px #ff9a1f,0 0 26px #ff7a00;animation-delay:.75s}
.c2::after{left:-4px;box-shadow:0 0 14px 4px #ff9a1f}
@keyframes trail{0%{transform:scaleX(0);opacity:1}75%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:.25}}

/* Logo NTRX : teinté en bleu néon, il s'allume en vacillant puis un éclat le traverse */
.logo{position:absolute;left:50%;top:34%;width:min(420px,60vw);aspect-ratio:2.25;transform:translate(-50%,-50%);opacity:0;
  filter:drop-shadow(0 0 10px #00e5ff) drop-shadow(0 0 34px #00b8ff99);animation:power 1s steps(1) 1s forwards}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.logo .cy{filter:url(#cyan)}
.logo .shine{clip-path:inset(0 100% 0 -20%);animation:shine .9s cubic-bezier(.4,0,.2,1) 2s forwards}
@keyframes power{0%{opacity:.85}8%{opacity:.1}16%{opacity:.9}24%{opacity:.2}32%{opacity:1}44%{opacity:.55}52%,100%{opacity:1}}
@keyframes shine{to{clip-path:inset(0 -20% 0 100%)}}

/* Texte */
.title{position:absolute;left:0;right:0;top:calc(34% + min(105px,15vw));text-align:center;font-size:clamp(16px,2.4vw,26px);font-weight:300;letter-spacing:1.1em;padding-left:1.1em;color:#e6fbff;text-shadow:0 0 10px #00e5ff,0 0 30px #00b8ff;opacity:0;animation:spread 1.1s cubic-bezier(.2,.8,.2,1) 1.6s forwards}
.sub{position:absolute;left:0;right:0;top:calc(34% + min(150px,21vw));text-align:center;font-size:11px;letter-spacing:.6em;padding-left:.6em;color:#5fa8bf;opacity:0;animation:fade .8s ease 2.2s forwards}
@keyframes spread{from{opacity:0;letter-spacing:.2em}to{opacity:1;letter-spacing:1.1em}}

/* Ligne de balayage qui descend l'écran */
.scan{position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(transparent,#00e5ff14 60%,#00e5ff55 98%,transparent);transform:translateY(-130px);animation:scan 1.3s cubic-bezier(.4,0,.6,1) .95s forwards}
@keyframes scan{to{transform:translateY(100vh)}}

.skip{position:absolute;right:22px;bottom:18px;font-size:11px;letter-spacing:.3em;color:#2f6f84;opacity:0;animation:fade .5s ease 1.2s forwards}
@media (prefers-reduced-motion:reduce){#stage{animation-delay:1.6s}.floor i{animation:none}}
</style>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="cyan" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .95  0 0 0 0 1  0 0 0 1 0"/></filter></svg>
<div id="stage">
  <div class="haze"></div>
  <div class="ceil"></div>
  <div class="floor"><i></i></div>
  <div class="horizon"></div>
  <div class="cycle c1"></div>
  <div class="cycle c2"></div>
  <div class="scan"></div>
  <div class="logo"><img class="cy" src="logo.png" alt=""><img class="shine" src="logo.png" alt=""></div>
  <div class="title">NITROXYDE</div>
  <div class="sub">THÈME TRON · ACTIVÉ</div>
  <div class="skip">CLIC POUR PASSER</div>
</div>
<script>
  // Fin de l'intro : la fenêtre principale retire cette vue quand le titre devient « fin »
  let ended = false;
  const end = () => { if (!ended) { ended = true; document.title = 'fin'; } };
  const st = document.getElementById('stage');
  st.addEventListener('animationend', e => { if (e.target === st) end(); });
  const skip = () => { st.style.animation = 'out .35s ease forwards'; };
  addEventListener('mousedown', skip); addEventListener('keydown', skip);
  setTimeout(end, 5200);
</script>
