<!doctype html>
<html lang="fr"><meta charset="utf-8"><title>Nitroxyde</title>
<link rel="stylesheet" href="theme.css">
<style>

*{box-sizing:border-box}
body{margin:0;display:flex;height:100vh;background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI Variable",system-ui,sans-serif}
nav{width:220px;padding:24px 12px;background:var(--bg2)}
nav h1{margin:0 12px 20px;font-size:22px;font-weight:300;text-shadow:0 0 18px var(--gl)}
nav a{display:block;padding:10px 12px;border-radius:8px;color:var(--dim);text-decoration:none;transition:background-color .15s,color .15s}
nav a:hover,nav a.on{background:var(--bg3);color:var(--tx)}
main{flex:1;overflow:auto;padding:28px 40px}
main>div{max-width:820px;animation:in .2s cubic-bezier(.2,.8,.2,1)}
h2{margin:0 0 16px;font-weight:400}
input,select,button{font:inherit;color:var(--tx);background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:8px 12px;outline:0;transition:border-color .15s}
input:focus,select:focus,button:hover{border-color:var(--ac)}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--ac)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bg3)}
.m{flex:1;min-width:0}
.m a,.m span{color:var(--tx);text-decoration:none}
small{display:block;overflow:hidden;color:var(--dim);text-overflow:ellipsis;white-space:nowrap}
.bar{height:4px;margin-top:6px;border-radius:2px;background:var(--bg3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);box-shadow:0 0 8px var(--gl);transform-origin:left}
section{margin-bottom:26px}
h3{margin:22px 0 8px;color:var(--dim);font-size:13px;font-weight:400}
.note{padding:6px 0;white-space:normal}
.ico{position:relative;display:grid;place-items:center;flex:none;width:32px;height:32px;overflow:hidden;border-radius:9px;background:var(--bg3);color:var(--dim);font-size:14px}
.ico::before{content:attr(data-l)}
.ico img{position:absolute;inset:0;box-sizing:border-box;width:100%;height:100%;padding:5px;object-fit:contain;background:var(--bg3)}
input[type=range]{width:160px;padding:0;accent-color:var(--ac)}
textarea{box-sizing:border-box;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg3);color:var(--tx);font:12.5px ui-monospace,Consolas,monospace;outline:0}
textarea:focus{border-color:var(--ac)}
.trk{padding:4px 0}
.trow .num{min-width:72px;text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
.trow.on{background:color-mix(in srgb,var(--ac) 8%,transparent);border-radius:10px}
code{padding:3px 8px;border-radius:6px;background:var(--bg3);font:12px Consolas,monospace;user-select:text}
.trk .m{padding:8px 12px;border-color:transparent;background:none;text-align:left}
.trk .m:hover{background:var(--bg3)}
.trk.on .m{border-color:var(--ac);color:var(--ac)}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-thumb{border:3px solid transparent;border-radius:10px;background:color-mix(in srgb,var(--dim) 45%,transparent) padding-box}
::-webkit-scrollbar-track{background:transparent}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<nav><img class="logo" src="logo.png" alt="Nitroxyde" style="width:150px;margin:0 12px 20px">
  <a href="#history">Historique</a><a href="#bookmarks">Favoris</a><a href="#downloads">Téléchargements</a><a href="#passwords">Mots de passe</a><a href="#tasks">Tâches</a><a href="#settings">Paramètres</a>
</nav>
<main id="m"></main>
<script src="skin.js"></script>
<script src="pages.js"></script>
