<!doctype html>
<html lang="fr"><meta charset="utf-8"><title>Bienvenue</title>
<link rel="stylesheet" href="theme.css">
<style>
html,body{height:100%;margin:0;overflow:auto;background:var(--bg);color:var(--tx);font:14px "Segoe UI Variable",system-ui,sans-serif}
body{position:relative;z-index:0}
main{box-sizing:border-box;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:32px 20px}
.logo{width:min(240px,60vw);animation:in .6s cubic-bezier(.2,.8,.2,1)}
h1{margin:6px 0 0;font-size:26px;font-weight:300}
p{margin:0;color:var(--dim);text-align:center}
#modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;width:min(940px,94vw);margin-top:18px}
.mode{display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--bg2);color:var(--tx);font:inherit;text-align:left;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .2s;animation:in .5s cubic-bezier(.2,.8,.2,1) backwards}
.mode:hover{transform:translateY(-4px);border-color:var(--ac);box-shadow:0 0 22px color-mix(in srgb,var(--gl) 30%,transparent)}
.mode i{font-size:28px;font-style:normal}
.mode b{font-size:16px;font-weight:600}
.mode span{color:var(--dim);font-size:12.5px;line-height:1.4}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<body>
<main>
  <img class="logo" src="logo.png" alt="Nitroxyde Browser">
  <h1>Bienvenue dans Nitroxyde Browser</h1>
  <p>Choisis comment tu utilises ton navigateur. Tu pourras changer à tout moment.</p>
  <div id="modes"></div>
  <p>Menu ☰ › Mode, ou Paramètres › Mode d'utilisation.</p>
</main>
<script src="skin.js"></script>
<script src="welcome.js"></script>
