<!doctype html>
<html lang="fr"><meta charset="utf-8"><title>Menu</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="theme.css">
<style>
html,body{margin:0;background:transparent;font:13.5px "Segoe UI Variable",system-ui,sans-serif;color:var(--tx);user-select:none;overflow:hidden}
#box{box-sizing:border-box;max-height:calc(100vh - 8px);overflow-y:auto;overscroll-behavior:contain;margin:0 6px 8px;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--bg2);
  background:linear-gradient(var(--bg2),var(--bg2)),var(--bg);box-shadow:0 3px 6px #0007;animation:in .14s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(-6px) scale(.98)}}
[data-anim=off] #box{animation:none}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{border:2px solid transparent;border-radius:8px;background:color-mix(in srgb,var(--dim) 45%,transparent) padding-box}
hr{height:1px;margin:5px 4px;border:0;background:var(--line)}
.it{display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;padding:6px 10px;border:0;border-radius:9px;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.it:hover,.it:focus-visible{background:var(--bg3);outline:0}
.it .l{flex:1}
.it kbd{color:var(--dim);font:11px inherit;font-family:inherit}
.it.dis{opacity:.4;pointer-events:none}
.it .arr{color:var(--dim)}
/* En-tête */
.head{display:flex;align-items:center;gap:10px;padding:8px 8px 10px}
.head img{width:74px;filter:drop-shadow(0 0 6px var(--gl))}
.head .v{flex:1;color:var(--dim);font-size:11px}
.seg{display:flex;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.seg button{padding:5px 10px;border:0;border-radius:8px;background:none;color:var(--dim);font:inherit;font-size:12px;cursor:pointer}
.seg button.on{background:var(--ac);color:var(--bg);font-weight:600}
/* Lignes de contrôle */
.ctl{display:flex;align-items:center;gap:6px;padding:5px 10px}
.ctl .l{flex:1}
.ctl button,.ctl select,.ctl input{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.ctl input{cursor:text;user-select:text}
.ctl button:hover,.ctl select:hover{border-color:var(--ac)}
.ctl button.sq{width:30px;padding:0;font-size:16px}
.ctl .val{min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.ctl select{max-width:150px}
/* Grille de raccourcis */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:2px}
.grid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px 7px;border:0;border-radius:10px;background:none;color:inherit;font:inherit;font-size:11px;cursor:pointer}
.grid button:hover{background:var(--bg3)}
.grid svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sq svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;vertical-align:middle}
.vh svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
details summary{list-style:none}
details summary::-webkit-details-marker{display:none}
details[open] summary .arr{transform:rotate(90deg)}
.arr{display:inline-block;transition:transform .15s}
.foot{display:flex;gap:4px;padding:2px}
.foot .it{justify-content:center}
.tip{padding:2px 12px 6px;color:var(--dim);font-size:11px;line-height:1.45}
/* VPN */
.vh{display:flex;align-items:center;gap:10px;padding:10px 10px 6px}
.vh b{flex:1;font-size:16px;font-weight:600}
.sw{position:relative;width:44px;height:24px;border:1px solid var(--line);border-radius:14px;background:var(--bg3);cursor:pointer;transition:background-color .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:transform .2s,background-color .2s}
.sw.on{background:color-mix(in srgb,var(--ac) 40%,var(--bg3));border-color:var(--ac)}
.sw.on::after{transform:translateX(20px);background:var(--ac);box-shadow:0 0 8px var(--ac)}
.sw.busy{opacity:.6;pointer-events:none}
.card{margin:4px 6px 8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.card.ok{border-color:#2ee59d88;box-shadow:inset 0 0 18px #2ee59d14}
.card.bad{border-color:#ff5d5d88}
.card .st{font-size:15px;font-weight:600}
.card .ip{margin-top:4px;color:var(--dim);font-size:12px;line-height:1.5}
.card .err{margin-top:6px;color:#ff8a8a;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;padding:2px 8px 6px}
.chips button{padding:6px 10px;border:1px solid var(--line);border-radius:20px;background:none;color:var(--dim);font:inherit;font-size:12px;cursor:pointer}
.chips button.on{border-color:var(--ac);color:var(--tx);background:var(--bg3)}
.f{display:flex;flex-direction:column;gap:4px;padding:4px 10px}
.f label{color:var(--dim);font-size:11.5px}
.f{min-width:0}
.f input,.f select{box-sizing:border-box;width:100%;min-width:0;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;user-select:text}
.f input:focus,.f select:focus{border-color:var(--ac);outline:0}
.row2{display:flex;gap:0}
.row2>*{flex:1}
.btn{margin:6px 10px;height:34px;padding:0 14px;border:1px solid var(--ac);border-radius:9px;background:var(--ac);color:var(--bg);font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--tx);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ac)}
.chk{display:flex;align-items:center;gap:8px;padding:6px 10px;color:var(--dim);font-size:12px;cursor:pointer}
.chk input{accent-color:var(--ac)}
a{color:var(--ac);cursor:pointer;text-decoration:none}
a:hover{text-decoration:underline}
</style>
<body class="ov">
<div id="box"></div>
<script src="skin.js"></script>
<script src="popup.js"></script>
