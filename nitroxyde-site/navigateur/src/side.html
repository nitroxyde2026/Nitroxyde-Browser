<!doctype html>
<html lang="fr"><meta charset="utf-8"><title>Outils</title>
<link rel="stylesheet" href="theme.css">
<style>
html,body{height:100%;margin:0;background:var(--bg2);color:var(--tx);font:13px/1.45 "Segoe UI Variable",system-ui,sans-serif}
body{box-sizing:border-box;padding:16px;overflow:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
h2{margin:0 0 12px;font-size:16px;font-weight:600}
input,select,textarea,button{box-sizing:border-box;border:1px solid var(--line);border-radius:8px;background:var(--bg3);color:var(--tx);font:inherit;outline:0}
input:focus,select:focus,textarea:focus,button:hover{border-color:var(--ac)}
button{padding:7px 10px;cursor:pointer;transition:border-color .15s}
input,select{padding:7px 9px}
textarea{width:100%;padding:9px 10px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row>*{flex:1;min-width:0}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.keys button{padding:12px 0;font-size:15px}
.big{width:100%;padding:12px;font-size:20px;text-align:right}
.res{margin-top:10px;padding:10px;border-radius:10px;background:var(--bg3);white-space:pre-wrap}
.trk{display:block;width:100%;margin:3px 0;text-align:left}
.trk.on{border-color:var(--ac)}
.bar{height:4px;margin-top:5px;border-radius:2px;background:var(--bg3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transform-origin:left}
small{color:var(--dim)}
</style>
<main id="m"></main>
<script src="skin.js"></script>
<script src="side.js"></script>
