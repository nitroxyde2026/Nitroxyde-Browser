<!doctype html>
<html lang="fr"><meta charset="utf-8"><title>Assistant IA</title>
<link rel="stylesheet" href="theme.css">
<style>
html,body{height:100%;margin:0;background:var(--bg2);color:var(--tx);font:13px/1.45 "Segoe UI Variable",system-ui,sans-serif}
body{box-sizing:border-box;display:flex;flex-direction:column;border-left:1px solid var(--line)}
header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
header b{flex:1;font-weight:600}
select,button,textarea{border:1px solid var(--line);border-radius:8px;outline:0;background:var(--bg3);color:var(--tx);font:inherit}
select{max-width:118px;padding:5px 6px}
button{padding:5px 10px;cursor:pointer;transition:border-color .15s}
button:hover,select:focus,textarea:focus{border-color:var(--ac)}
#chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px}
#chips button{border-radius:14px;font-size:12px}
#log{flex:1;overflow-y:auto;padding:4px 14px}
.m{margin:8px 0;padding:9px 12px;border-radius:12px;background:var(--bg3)}
.m.u{margin-left:30px;background:color-mix(in srgb,var(--ac) 18%,var(--bg3))}
.m.err{color:#ff8a8a}
.m p,.m h4{margin:0 0 6px}
.m ul{margin:0 0 6px;padding-left:18px}
.m pre{margin:0 0 6px;padding:8px;overflow:auto;border-radius:8px;background:var(--bg);font-size:12px}
.m code{padding:0 4px;border-radius:4px;background:var(--bg)}
.hint{padding:14px;color:var(--dim);text-align:center}
.fc{display:grid;place-items:center;min-height:110px;padding:14px;border:1px solid transparent;border-radius:12px;background:var(--bg);font-size:14px;text-align:center;cursor:pointer}
.fc[data-side=a]{border-color:var(--ac)}
.fcn{display:flex;justify-content:center;gap:10px;margin:8px 0 4px}
footer{display:flex;flex-direction:column;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
footer div{display:flex;gap:6px}
footer label{color:var(--dim);font-size:12px}
textarea{flex:1;resize:none;padding:8px 10px}
</style>
<header><b>✦ IA</b><select id="prov" title="Fournisseur"></select><select id="model" title="Modèle"></select><button id="reset" title="Nouvelle conversation">↺</button><button id="x" title="Fermer">✕</button></header>
<div id="chips">
  <button data-k="summary">Résumer</button><button data-k="video">Résumer la vidéo</button><button data-k="study">Fiche de révision</button><button data-k="cards">Mode Études</button>
  <button data-k="compare">Comparer les onglets</button><button data-k="code">Expliquer le code</button><button data-k="translate">Traduire</button><button data-k="rewrite">Reformuler</button>
</div>
<div id="log"><p class="hint">Pose une question ou utilise un raccourci. Les textes envoyés partent chez Groq.</p></div>
<footer>
  <label><input id="ctx" type="checkbox" checked> Utiliser le contenu de la page</label>
  <div><textarea id="q" rows="2" placeholder="Pose une question…"></textarea><button id="send">↑</button></div>
</footer>
<script src="skin.js"></script>
<script src="ai.js"></script>
