# Construit l'installateur Windows de Nitroxyde Navigation sur un PC Windows de GitHub,
# le publie dans une Release, puis met à jour version.json : le bouton « Télécharger » du site pointe dessus.
# Se lance tout seul quand le numéro de version change (navigateur/package.json), ou à la main :
# onglet Actions › Publier le navigateur › Run workflow.
name: Publier le navigateur

on:
  workflow_dispatch:
  push:
    paths: ['navigateur/package.json']

permissions:
  contents: write

concurrency: publier-navigateur

jobs:
  publier:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Construire l'installateur Windows
        working-directory: navigateur
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npx electron-builder --win --x64 --publish never

      - name: Publier la Release et mettre à jour version.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node navigateur/outils/release.js
